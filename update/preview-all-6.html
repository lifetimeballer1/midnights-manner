class Engine {
  constructor(){this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.out=this.ctx.createGain();this.out.gain.value=0.9;this.out.connect(this.ctx.destination);this.n=1;this.i=0;this.t=null;this.on=false;}
  f(n){const N=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];const m=String(n).match(/^([A-G][#b]?)([0-8])$/);if(!m)return 440;let s=m[1],o=+m[2];if(s.includes('b'))s=N[(N.indexOf(s[0])-1+12)%12];return 440*Math.pow(2,((N.indexOf(s)-9)+(o-4)*12)/12);}
  tone(f,t,d,v,c=1500,ty='triangle',atk=0.025){const o=this.ctx.createOscillator(),g=this.ctx.createGain(),fl=this.ctx.createBiquadFilter();o.type=ty;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=c;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0011,v*0.38),t+atk);g.gain.exponentialRampToValueAtTime(0.0001,t+d*0.95);o.connect(fl);fl.connect(g);g.connect(this.out);o.start(t);o.stop(t+d+0.15);}
  musicbox(f,t,d,v){this.tone(f,t,d*1.4,v*0.8,2200,'sine',0.01);}
  strings(fs,t,d){fs.forEach(f=>{this.tone(f,t,d,0.16,1200,'sawtooth',0.5);this.tone(f/2,t,d,0.10,800,'triangle',0.4);});}
  choir(fs,t,d){fs.forEach(f=>{[0,4,7].forEach(iv=>{const ff=f*Math.pow(2,iv/12);this.tone(ff,t,d,0.08,1800,'triangle',0.4);});});}
  kick(t,v=0.9){const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sine';o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(40,t+0.22);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.26);o.connect(g);g.connect(this.out);o.start(t);o.stop(t+0.04);}
  snare(t,v=0.5){const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='triangle';o.frequency.value=190;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);o.connect(g);g.connect(this.out);o.start(t);o.stop(t+0.2);}
  hat(t){const o=this.ctx.createOscillator(),g=this.ctx.createGain(),f=this.ctx.createBiquadFilter();o.type='triangle';o.frequency.value=6000;f.type='lowpass';f.frequency.value=4000;g.gain.setValueAtTime(0.025,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.025);o.connect(f);f.connect(g);g.connect(this.out);o.start(t);o.stop(t+0.04);}
  drums(groove,now,bs,bars){
    if(groove==="lush"){[1,5].forEach(b=>this.kick(now+(b-1)*bs,0.7));[2,4,6,8].forEach(b=>this.snare(now+(b-1)*bs,0.35));for(let b=1;b<=8;b+=2)this.hat(now+(b-1)*bs);}
    else if(groove==="calm"){[1,9].forEach(b=>this.kick(now+(b-1)*bs,0.5));[5,13].forEach(b=>this.snare(now+(b-1)*bs,0.22));[1,5,9,13].forEach(b=>this.hat(now+(b-1)*bs));}
    else if(groove==="soulcalm"){[1,10.6].forEach(b=>this.kick(now+(b-1)*bs,0.55));[5,13].forEach(b=>this.snare(now+(b-1)*bs,0.28));for(let b=1;b<=16;b+=4)this.hat(now+(b-1)*bs);}
    else{[1,4,6.5].forEach(b=>this.kick(now+(b-1)*bs));[2,4,6,8].forEach(b=>this.snare(now+(b-1)*bs));for(let b=1;b<=8;b+=1)this.hat(now+(b-1)*bs);}
  }
  tick(){if(!this.on)return;const T=TRACKS[this.n],bs=60/T.tempo,ph=T.phrases[this.i],now=this.ctx.currentTime+0.06;
    this.tone(this.f(ph.bass),now,ph.bars*4*bs*0.9,0.45,350,'sine',0.15);
    if(T.strings) this.strings(ph.pad.map(n=>this.f(n)),now+0.08,ph.bars*4*bs*0.85);
    else if(T.choir) this.choir(ph.pad.map(n=>this.f(n)),now+0.08,ph.bars*4*bs*0.85);
    else ph.pad.forEach(n=>this.tone(this.f(n),now+0.08,ph.bars*4*bs*0.85,0.18,700,'sine',0.2));
    if(T.box) ph.melody.forEach(m=>this.musicbox(this.f(m.note),now+(m.beat-1)*bs,(m.dur||1)*bs,m.vel||0.4));
    else ph.melody.forEach(m=>this.tone(this.f(m.note),now+(m.beat-1)*bs,(m.dur||1)*bs,m.vel||0.5,1500,'triangle',0.025));
    this.drums(T.groove||"boom",now,bs,ph.bars);
    document.getElementById('status').textContent='▶ #'+this.n+' '+T.title+' — phrase '+(this.i+1)+'/'+T.phrases.length;
    document.querySelectorAll('#btns button').forEach(x=>x.classList.toggle('active',+x.dataset.n===this.n));
    this.i=(this.i+1)%T.phrases.length;this.t=setTimeout(()=>this.tick(),ph.bars*4*bs*1000);}
}
let e=null;const btns=document.getElementById('btns');
Object.keys(TRACKS).forEach(n=>{const b=document.createElement('button');b.textContent='#'+n+' '+TRACKS[n].title;b.dataset.n=n;b.onclick=async()=>{if(e){e.on=false;clearTimeout(e.t);}e=new Engine();if(e.ctx.state==='suspended')await e.ctx.resume();e.n=+n;e.i=0;e.on=true;e.tick();};btns.appendChild(b);});
document.getElementById('stop').onclick=()=>{if(e){e.on=false;clearTimeout(e.t);}document.getElementById('status').textContent='Stopped. Pick a number.';};
